# Tarjetas de github-readme-stats generadas con su acción oficial (método recomendado en su README)
# y guardadas en assets/. Fondo transparente, sin borde y colores de la paleta del portafolio.
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # a diario, 03:00 UTC
  workflow_dispatch:
  push: # primera generación al subir el workflow
    branches: [main]
    paths: [".github/workflows/readme-stats.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Comunes: transparente, sin borde, en español
      BASE: bg_color=00000000&hide_border=true&locale=es
      DARK: title_color=d4d5d1&text_color=aaaba6&icon_color=d4173a&ring_color=d4173a
      LIGHT: title_color=a10a28&text_color=111c1e&icon_color=a10a28&ring_color=a10a28
    steps:
      - uses: actions/checkout@v6

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&${{ env.BASE }}&${{ env.DARK }}
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&${{ env.BASE }}&${{ env.LIGHT }}
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.BASE }}&${{ env.DARK }}
          path: assets/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.BASE }}&${{ env.LIGHT }}
          path: assets/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/top-langs-*.svg
          git commit -m "Update README cards" || exit 0
          git push
