# Serpiente sobre el gráfico de contribuciones (Platane/snk), con la paleta del portafolio.
# Publica los SVG en la rama `output`; el README los lee desde ahí.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # a diario, 00:00 UTC
  workflow_dispatch:
  push: # primera generación al subir el workflow
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # color_dots: 0 contribuciones primero y luego de menos a más (exactamente 5), accentDark → accent
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a10a28&color_dots=#ebedf0,#690920,#7b0a23,#8e0a26,#a10a28
            dist/github-snake-dark.svg?color_snake=#a10a28&color_dots=#1b2729,#690920,#7b0a23,#8e0a26,#a10a28

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
